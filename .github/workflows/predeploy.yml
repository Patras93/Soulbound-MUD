name: Soulbound Predeploy

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  predeploy:
    name: Python 3.12 predeploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run fast Railway predeploy
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python predeploy_check.py
      - name: Assemble full runtime and run every audit
        env:
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
        run: python predeploy_full.py
