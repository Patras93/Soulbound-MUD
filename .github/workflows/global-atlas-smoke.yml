name: Global Atlas behavior smoke
on:
  push:
    branches:
      - feature/global-discovery-atlas-v1120
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Atlas catalog and completion smoke
        env:
          SOULBOUND_DEFER_MEMORY_COMPACTION: '1'
        run: |
          python - <<'PY'
          import server
          from player.session_mixins.exploration_progress import SessionExplorationProgressMixin
          from world.generation_systems import v0140_surface_secret_room_ids

          obj = object.__new__(SessionExplorationProgressMixin)
          catalog = obj.global_discovery_atlas_catalog_v1120()
          expected = {'cities','islands','dungeons','platforms','ruins','superbosses','secrets'}
          assert set(catalog) == expected, set(catalog)
          for key, rows in catalog.items():
              assert rows, f'{key}: empty catalog'
              keys = [row['key'] for row in rows]
              assert len(keys) == len(set(keys)), f'{key}: duplicate keys'
              print(f'{key}: {len(rows)}')

          discovered = set()
          for rows in catalog.values():
              for row in rows:
                  discovered.update(row.get('room_ids', ()))
                  for prefix in row.get('prefixes', ()):
                      discovered.add(prefix + '01')

          class DB:
              def discovered_room_ids(self, account_id):
                  return set(discovered)
              def collection_entry_ids(self, account_id, collection):
                  if collection == 'surface_secrets_v0140':
                      return set(v0140_surface_secret_room_ids())
                  return set()
          class S:
              db = DB()
          obj.server = S()
          obj.account_id = 1
          state = obj.global_discovery_atlas_state_v1120()
          assert all(row['complete'] for row in state.values()), state
          print('GLOBAL ATLAS COMPLETION STATE PASS')
          PY
