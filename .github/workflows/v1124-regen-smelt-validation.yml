name: Regen and smelt stop validation
on:
  push:
    branches:
      - feature/standing-rest-regen-v1124
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed files
        run: python -m py_compile player/session_mixins/rest_mana.py player/session_mixins/session_runtime_state.py player/session_mixins/io_auth_character.py player/session_mixins/command_loop.py player/session_mixins/crafting.py player/session_mixins/crafting_expansion.py admin/help_refresh.py server.py
      - name: Fast predeploy
        run: python predeploy_check.py
      - name: Full runtime and contracts
        env:
          SOULBOUND_DEFER_MEMORY_COMPACTION: '1'
        run: |
          python - <<'PY'
          import asyncio
          from pathlib import Path
          import server
          import player.session_mixins.rest_mana as rest_mod

          assert server.REST_REGEN_PERCENT == 10
          assert rest_mod.STANDING_REGEN_PERCENT_V1124 == 2
          assert hasattr(server.Session, 'smelt_item_v03114')
          assert hasattr(server.Session, 'stop_smelt_v1124')
          assert hasattr(server.Session, 'smelt_wait_v1124')

          smelt_src = Path('player/session_mixins/crafting_expansion.py').read_text(encoding='utf-8')
          craft_src = Path('player/session_mixins/crafting.py').read_text(encoding='utf-8')
          command_src = Path('player/session_mixins/command_loop.py').read_text(encoding='utf-8')
          rest_src = Path('player/session_mixins/rest_mana.py').read_text(encoding='utf-8')
          assert 'async def smelt_item_v03114' in smelt_src
          assert 'norm in ("stop", "off", "przerwij", "koniec")' in smelt_src
          assert 'norm in ("status", "stan")' in smelt_src
          assert 'await self.smelt_wait_v1124(action_seconds)' in craft_src
          assert command_src.index('if self.smelt_task_active_v1124():') < command_src.index('if raw.startswith')
          assert 'przetop status albo przetop stop' in command_src
          assert 'smelt_task_active_v1124' in rest_src
          assert command_src.count('await self.stop_smelt_v1124(announce=False)') >= 2

          async def check_stop():
              s = server.Session(None, None, None)
              messages = []
              async def send(msg, *args, **kwargs):
                  messages.append(str(msg))
              s.send = send
              started = asyncio.Event()
              completed = {'value': False}

              async def fake_smelt(raw):
                  started.set()
                  await s.smelt_wait_v1124(30.0)
                  completed['value'] = True
                  return True

              s._smelt_execute_v1124 = fake_smelt
              ok = await s.smelt_item_v03114('żelazo')
              assert ok is True
              await asyncio.wait_for(started.wait(), 1.0)
              assert s.smelt_task_active_v1124()
              await s.smelt_item_v03114('status')
              stopped = await s.smelt_item_v03114('stop')
              assert stopped is True
              assert not s.smelt_task_active_v1124()
              assert completed['value'] is False
              assert any('Przetapianie zatrzymane' in m for m in messages), messages

          asyncio.run(check_stop())
          print('SMELT STOP INTERRUPT PASS')
          print('SMELT STATUS PASS')
          print('SMELT BUSY GUARD PASS')
          print('STANDING REGEN PAUSE DURING SMELT PASS')
          print('FULL RUNTIME IMPORT PASS')
          PY
