name: Class quest validation
on:
  push:
    branches:
      - feature/global-discovery-atlas-v1120
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile changed class quest files
        run: |
          python -m py_compile systems/equipment_crafting.py player/session_mixins/class_guild_progress.py player/character.py player/session_mixins/crafting.py admin/help_refresh.py
      - name: Fast predeploy
        run: python predeploy_check.py
      - name: Full runtime import
        env:
          SOULBOUND_DEFER_MEMORY_COMPACTION: '1'
        run: python -c "import server; print('FULL RUNTIME IMPORT PASS')"
      - name: Class quest 14x5 smoke
        env:
          SOULBOUND_DEFER_MEMORY_COMPACTION: '1'
        run: |
          python - <<'PY'
          import asyncio
          import time
          import server
          from systems.equipment_crafting import GUILD_CLASS_QUEST_POOLS
          from player.session_mixins.class_guild_progress import SessionClassGuildProgressMixin

          expected = {'kill','boss','explore','gather','craft'}
          assert len(GUILD_CLASS_QUEST_POOLS) == 14
          total = 0
          for cls, pool in GUILD_CLASS_QUEST_POOLS.items():
              assert len(pool) == 5, (cls, len(pool))
              assert {row[5] for row in pool} == expected, cls
              assert len({row[0] for row in pool}) == 5, cls
              total += len(pool)
          assert total == 70
          print('CLASS QUEST CATALOG PASS: 14 classes, 70 quests')

          class FakeCharacter:
              def __init__(self):
                  self.class_name = 'Wojownik'
                  self.classes = ['Wojownik']
                  self.soul_level = 25
                  self.silver = 0
                  self.store = {
                      'Wojownik': {'accepted': True, 'progress': 2, 'completed': False}
                  }
              def _guild_json(self, name):
                  return dict(self.store)
              def _set_guild_json(self, name, value):
                  self.store = dict(value)

          class FakeDB:
              def save_character(self, character):
                  pass
          class FakeServer:
              db = FakeDB()

          obj = object.__new__(SessionClassGuildProgressMixin)
          obj.character = FakeCharacter()
          obj.server = FakeServer()
          obj.account_id = 1
          obj.active_class_names = lambda: ['Wojownik']
          messages = []
          async def send(msg):
              messages.append(str(msg))
          obj.send = send

          states, state = obj.class_guild_quest_state_v1120('Wojownik')
          assert state['active'] == 0
          assert state['quests']['0']['progress'] == 2
          assert len(obj.class_guild_quest_order_v1120('Wojownik', state['slot'])) == 5
          data = GUILD_CLASS_QUEST_POOLS['Wojownik'][0]
          asyncio.run(obj.advance_class_guild_quest_v11132(data[5], 1))
          assert obj.character.store['Wojownik']['quests']['0']['progress'] == 3
          print('LEGACY MIGRATION + ACTIVE PROGRESS PASS')

          old_slot = obj.class_guild_quest_hour_slot_v1120() - 1
          obj.character.store['Wojownik'] = {
              'slot': old_slot, 'active': None,
              'quests': {'2': {'progress': 9, 'completed': True}},
              'ever_completed': True,
          }
          states, state = obj.class_guild_quest_state_v1120('Wojownik')
          assert state['slot'] != old_slot
          assert state['active'] is None
          assert state['quests'] == {}
          assert state['ever_completed'] is True
          print('HOURLY RESET + HISTORY PASS')
          PY
