name: Maxwell combat hotfix validation
on:
  push:
    branches:
      - fix/maxwell-class-skills-v1122
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile player/session_mixins/combat_realtime.py player/session_mixins/skill_learning.py server.py
      - name: Fast predeploy
        run: python predeploy_check.py
      - name: Full runtime and Session contract
        env:
          SOULBOUND_DEFER_MEMORY_COMPACTION: '1'
        run: |
          python - <<'PY'
          import inspect
          import server
          import world.party_combo_ultimate_summary as party_wrap
          assert hasattr(server.Session, 'class_skills')
          wrapped = party_wrap._realtime_player_action_before_v0380
          src = inspect.getsource(wrapped)
          assert 'self.class_skills()' in src
          assert 'self.available_class_skills()' not in src
          assert server.Session.realtime_player_action.__module__ == 'world.party_combo_ultimate_summary'
          print('FINAL WRAPPER CAPTURES FIXED REALTIME ACTION PASS')
          print('FULL RUNTIME IMPORT PASS')
          PY
