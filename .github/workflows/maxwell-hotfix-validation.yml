name: Maxwell combat hotfix validation
on:
  push:
    branches:
      - fix/maxwell-class-skills-v1122
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile player/session_mixins/combat_realtime.py player/session_mixins/skill_learning.py server.py
      - name: Fast predeploy
        run: python predeploy_check.py
      - name: Full runtime and Session contract
        env:
          SOULBOUND_DEFER_MEMORY_COMPACTION: '1'
        run: |
          python - <<'PY'
          import inspect
          import server
          assert hasattr(server.Session, 'class_skills')
          print('SESSION class_skills:', server.Session.class_skills.__module__, server.Session.class_skills.__qualname__)
          method = server.Session.realtime_player_action
          print('REALTIME METHOD:', method.__module__, method.__qualname__)
          src = inspect.getsource(method)
          print('HAS NEW CALL:', 'self.class_skills()' in src)
          print('HAS OLD CALL:', 'self.available_class_skills()' in src)
          print(src[:1800])
          print('FULL RUNTIME IMPORT PASS')
          PY
