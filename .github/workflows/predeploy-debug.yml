name: Predeploy Debug

on:
  push:
    branches:
      - "debug/**"
  pull_request:
    branches:
      - main

jobs:
  predeploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run fast predeploy
        run: python predeploy_check.py
