name: Inspect Soul equipment progression
on:
  push:
    branches:
      - feature/standing-rest-regen-v1124
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect effective equipment
        env:
          SOULBOUND_DEFER_MEMORY_COMPACTION: '1'
        run: |
          python - <<'PY'
          import server
          from systems.equipment_crafting import CLASS_SET_BONUSES

          stat_keys=('strength','dexterity','constitution','intelligence','willpower')
          def eff(item):
              out={k:0 for k in stat_keys}
              for src in (item.get('stats') or {}, item.get('soulbound_balance_stats') or {}):
                  for k,v in src.items():
                      if k in out: out[k]+=int(v or 0)
              aff=str(item.get('affix') or '')
              if aff in out: out[aff]+=int(item.get('affix_amount',0) or 0)
              return {k:v for k,v in out.items() if v}
          def score(item): return sum(eff(item).values())

          print('=== UOSS BLACK RABITE EFFECTIVE ===')
          for iid,item in server.ITEMS.items():
              if iid.startswith('uoss_black_rabite_unique_') or iid=='moogle_board':
                  print('UOSS',iid,item.get('name'),'slot',item.get('slot'),'req',item.get('required_level'),'score',score(item),'def',item.get('defense',0),'eff',eff(item),'props',item.get('properties'))

          print('=== LEVEL 600 LEGENDARY SAME SLOTS ===')
          for cls in ('Wojownik','Berserker','Łotrzyk','Łowca','Mnich','Strażnik','Mag','Nekromanta','Kapłan','Czarownik','Druid','Psionik','Mec','Inżynier'):
              rows=[]
              for iid,item in server.ITEMS.items():
                  if item.get('legendary_loot_tier')!=600 or item.get('required_class')!=cls: continue
                  rows.append((item.get('slot'),iid,item.get('name'),score(item),item.get('defense',0),eff(item),item.get('properties')))
              print('CLASS',cls,'SETBONUS',CLASS_SET_BONUSES.get(cls))
              for row in sorted(rows): print('L600',cls,row)

          print('=== SLOT MAX SCORE AT 600 ===')
          by={}
          for iid,item in server.ITEMS.items():
              if item.get('legendary_loot_tier')!=600: continue
              slot=str(item.get('slot') or '')
              row=(score(item),iid,item.get('name'),item.get('required_class'),item.get('defense',0),eff(item),item.get('properties'))
              if slot not in by or row[0]>by[slot][0]: by[slot]=row
          for slot,row in sorted(by.items()): print('SLOTMAX',slot,row)
          PY
